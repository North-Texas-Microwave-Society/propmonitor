# propmonitor configuration
frequency: 28330000 # Hz — 10 m beacon band
mode: beacon # usb | lsb | am | nfm | wfm | cw | beacon
driver: "rtlsdr,serial=03340219" # Nooelec NESDR SMArt v5
sample_rate: 250000 # narrow rate gives waterfall ~244 Hz/bin
gain: 10 # low — TX is inches away, avoid front-end compression
ppm: 0
period_seconds: 60

beacon:
  offset_hz: 0
  bandwidth_hz: 50

http:
  bind: "0.0.0.0:5760"

