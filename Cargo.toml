[package]
name = "propmonitor"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
num-complex = "0.4"
rustfft = "6"
soapysdr = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.29 is the version axum's `ws` feature already pulls in, so the sync
# client shares one tungstenite copy with the server side. rustls +
# webpki roots match reqwest's TLS choice — no openssl anywhere.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Pure-Rust SHA-256 for self-update asset verification. No OpenSSL, no C.
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "propmonitor"
path = "src/main.rs"

[[bin]]
name = "sdr_diag"
path = "src/bin/sdr_diag.rs"
