# The cross builds run in a container, so the build identity `build.rs`
# reads has to be forwarded across that boundary explicitly — otherwise
# cross-built binaries fall back to "dev" and every node would believe it
# is already current.
[build.env]
passthrough = ["PROP_BUILD_COMMIT"]

[target.aarch64-unknown-linux-gnu]
image = "propmonitor-cross-aarch64"

[target.armv7-unknown-linux-gnueabihf]
image = "propmonitor-cross-armv7"
